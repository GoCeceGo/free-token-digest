name: Daily Free Token Digest

on:
  schedule:
    # GitHub Actions cron 使用 UTC；01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Get date
        id: date
        run: echo "date=$(TZ='Asia/Shanghai' date '+%Y年%m月%d日')" >> $GITHUB_OUTPUT

      - name: Fetch free token info
        run: python fetch_free_tokens.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send email digest
        uses: dawidd6/action-send-mail@v3
        with:
          from: ${{ secrets.SMTP_USERNAME }}
          server_address: ${{ contains(secrets.SMTP_USERNAME, '@qq.com') && 'smtp.qq.com' || 'smtp.163.com' }}
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Free Token Digest - ${{ steps.date.outputs.date }}
          html_body: file://email_body.html
          to: ${{ secrets.RECIPIENT_EMAIL }}

      - name: Persist digest history
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain data/digest_history.json | grep -q .; then
            git add data/digest_history.json
            git commit -m "chore: update digest history"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
